<!DOCTYPE html>
<html>

<head>
  <title>Time Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="main.css" rel="stylesheet">
</head>

<body>
  <div id="header">
    <!-- <button id="history">History</button> -->
    <h1>Total: <span id="total"></span></h1>
    <h2><span id="estimateLabel"><span id="estimateValue">7</span><input id="estimateInput" type="number" inputmode="decimal" step="0.1" min="0.1" max="20">h</span>: <span id="endTime"></span></h2>
    <h2>Next <select id="granularitySelect">
        <option value="6">tenth</option>
        <option value="30">half</option>
        <option value="60">hour</option>
      </select>: <span id="tenth"></span></h2>
    <button id="clear">Clear</button>
  </div>
  <div id="listWrap">
    <table id="list"></table>
    <h2 id="none">No Entries</h2>
  </div>
  <button id="add">+</button>
  <script src="script.js"></script>
</body>

</html>
